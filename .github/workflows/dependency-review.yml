name: Dependency review

# Blocks pull requests that introduce dependencies with known vulnerabilities or disallowed
# licenses. This complements CodeQL, which only analyzes first party code.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
